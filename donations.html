<!DOCTYPE html><html lang="or"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ଦାନ ବିବରଣୀ | 24 Prahara</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Oriya",sans-serif;background:#fff8eb;color:#3d2730}header{background:#5b1020;color:white;padding:18px 5%;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header img{width:54px;height:54px;object-fit:contain;background:white;border-radius:50%;padding:4px}h1{margin:0;font-size:clamp(20px,4vw,30px)}main{padding:28px 5%;max-width:1100px;margin:auto}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}.nav a,.btn{background:#6d1525;color:white;text-decoration:none;padding:10px 16px;border-radius:9px;border:0;cursor:pointer}.panel{background:white;border:1px solid #ead8b4;border-radius:15px;padding:22px;margin-bottom:18px;box-shadow:0 2px 10px #5b102010}.panel h2{color:#6d1525;margin:0 0 14px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.controls input,.controls select{padding:11px;border:1px solid #d8c5a5;border-radius:9px;font:inherit;flex:1;min-width:160px}.status{font-weight:700;padding:8px 12px;border-radius:20px;display:inline-block;background:#eee}.live{background:#e2f6e8;color:#176b35}.error{background:#ffe6e6;color:#a40000}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 10px;border-bottom:1px solid #eee;text-align:left}th{background:#f7ecd8;color:#5b1020}footer{text-align:center;background:#3e0d18;color:#f8e6bd;padding:18px}.muted{color:#75656a}@media(max-width:600px){main{padding:20px 4%}.panel{padding:16px}}</style></head><body><header><img src="logo.png" alt="Logo"><h1>୨୪ ପ୍ରହର ନାମଯଜ୍ଞ ମହୋତ୍ସବ ପରିଚାଳନା କମିଟି, ଗୁଣୁପୁର</h1></header><main><div class="nav"><a href="index.html">🏠 Home</a><a href="javascript:history.back()">↩ Back</a><a href="index.html">☰ Menu</a></div><section class="panel"><h2>ଦାନ ବିବରଣୀ</h2><p>ନଗଦ ଓ ସାମଗ୍ରୀ ଦାନର ବିବରଣୀ</p><div><span id="status" class="status">Data Loading…</span></div><div class="controls"><input id="search" placeholder="ଦାତାଙ୍କ ନାମ / ସାମଗ୍ରୀ ଖୋଜନ୍ତୁ"><select id="type"><option value="">ସମସ୍ତ ଦାନ</option><option value="cash">ନଗଦ ଦାନ</option><option value="item">ସାମଗ୍ରୀ ଦାନ</option></select><button class="btn" id="refresh">↻ Refresh</button></div><div class="tablewrap"><table><thead><tr><th>କ୍ରମିକ</th><th>ଦାତାଙ୍କ ନାମ</th><th>ଦାନ ପ୍ରକାର</th><th>ସାମଗ୍ରୀ</th><th>ପରିମାଣ</th><th>ରାଶି</th></tr></thead><tbody id="rows"><tr><td colspan="6">Data loading…</td></tr></tbody></table></div><p class="muted" id="count"></p></section></main><footer>ଗୁଜବରେ ବିଶ୍ୱାସ ନ କରି, ପ୍ରମାଣ ମାଗନ୍ତୁ।<br><small>Website Designed &amp; Developed by Rabi</small></footer><script>const API='https://script.google.com/macros/s/AKfycbxJHFvJ7uQCo1tmON660ITNqkR8b7drviS2Is7I7IyhxKvO_n9JfnivO_UtT33lGtnv/exec';let all=[];const status=document.getElementById('status');function val(x){return x==null?'':String(x)}function render(){const q=document.getElementById('search').value.toLowerCase(),t=document.getElementById('type').value;let list=all.filter(d=>{const name=val(d.donorName||d.name).toLowerCase(),item=val(d.itemName).toLowerCase(),typ=val(d.donationType).toLowerCase();const cash=typ.includes('cash')||typ.includes('ନଗଦ')||(!d.itemName&&d.amount);const isItem=!!d.itemName||typ.includes('item')||typ.includes('ସାମଗ୍ରୀ');return(!q||name.includes(q)||item.includes(q)||typ.includes(q))&&(!t||(t==='cash'&&cash)||(t==='item'&&isItem))});document.getElementById('rows').innerHTML=list.length?list.map((d,i)=>`<tr><td>${val(d.serial||i+1)}</td><td>${val(d.donorName||d.name)}</td><td>${val(d.donationType)}</td><td>${val(d.itemName)}</td><td>${val(d.quantity)} ${val(d.unit)}</td><td>${d.amount?('₹'+val(d.amount)):''}</td></tr>`).join(''):'<tr><td colspan="6">କୌଣସି ତଥ୍ୟ ମିଳିଲା ନାହିଁ</td></tr>';document.getElementById('count').textContent=`ଦେଖାଯାଉଥିବା ରେକର୍ଡ: ${list.length}`;}async function load(){status.textContent='Data Loading…';status.className='status';try{const res=await fetch(API+'?action=data&callback=');const text=await res.text();let data;try{data=JSON.parse(text)}catch{const match=text.match(/\{[\s\S]*\}/);if(!match)throw new Error('Invalid API response');data=JSON.parse(match[0])}all=data.donations||data.donationData||[];status.textContent='Live';status.className='status live';render()}catch(e){status.textContent='Connection Error';status.className='status error';document.getElementById('rows').innerHTML='<tr><td colspan="6">API connection ହୋଇନାହିଁ। Refresh କରନ୍ତୁ କିମ୍ବା ପରେ ପୁଣି ଚେଷ୍ଟା କରନ୍ତୁ।</td></tr>';document.getElementById('count').textContent='';}}document.getElementById('search').addEventListener('input',render);document.getElementById('type').addEventListener('change',render);document.getElementById('refresh').addEventListener('click',load);load();</script></body></html>
