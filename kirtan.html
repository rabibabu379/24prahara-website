<!DOCTYPE html><html lang="or"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>କୀର୍ତ୍ତନ ମଣ୍ଡଳୀ | 24 Prahara</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Oriya",sans-serif;background:#fff8eb;color:#3d2730}header{background:#5b1020;color:white;padding:18px 5%;display:flex;align-items:center;gap:12px}header img{width:54px;height:54px;object-fit:contain;background:white;border-radius:50%;padding:4px}h1{margin:0;font-size:clamp(20px,4vw,30px)}main{padding:30px 5%;max-width:1100px;margin:auto}.nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}.nav a,.btn{background:#6d1525;color:white;text-decoration:none;padding:10px 16px;border-radius:9px;border:0;cursor:pointer;font:inherit}.panel{background:white;border:1px solid #ead8b4;border-radius:15px;padding:25px;min-height:240px}.panel h2{color:#6d1525;margin-top:0}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.controls input,.controls select{padding:12px;border:1px solid #dfc28c;border-radius:9px;font:inherit;flex:1;min-width:180px}.status{padding:8px 14px;border-radius:25px;background:#e2f6e8;color:#176b36;display:inline-block;font-weight:700}.tablewrap{overflow:auto;margin-top:16px}table{border-collapse:collapse;width:100%;min-width:650px}th{background:#f5ead4;color:#681426;text-align:left}th,td{padding:13px 12px;border-bottom:1px solid #eee}footer{text-align:center;background:#3e0d18;color:#f8e6bd;padding:18px}footer small{display:block;margin-top:7px;color:#e8cf9b}@media(max-width:600px){main{padding:22px 4%}.panel{padding:16px}}</style></head><body><header><img src="logo.png" alt="Logo"><h1>୨୪ ପ୍ରହର ନାମଯଜ୍ଞ ମହୋତ୍ସବ ପରିଚାଳନା କମିଟି, ଗୁଣୁପୁର</h1></header><main><div class="nav"><a href="index.html">🏠 Home</a><a href="javascript:history.back()">↩ Back</a><a href="index.html">☰ Menu</a></div><section class="panel"><h2>କୀର୍ତ୍ତନ ମଣ୍ଡଳୀ ତାଲିକା</h2><p>ବର୍ତ୍ତମାନ ମଣ୍ଡଳୀ ଓ ନାମ ସଂକୀର୍ତ୍ତନ ସମ୍ବନ୍ଧୀୟ ବିବରଣୀ</p><span class="status" id="state">Loading…</span><div class="controls"><input id="search" placeholder="ମଣ୍ଡଳୀ ନାମ / status ଖୋଜନ୍ତୁ"><select id="filter"><option value="all">ସମସ୍ତ ମଣ୍ଡଳୀ</option><option value="active">ଚାଲୁ / Active</option><option value="inactive">ଅନ୍ୟ status</option></select><button class="btn" onclick="loadData()">↻ Refresh</button></div><div class="tablewrap"><table><thead><tr><th>କ୍ରମ</th><th>ମଣ୍ଡଳୀ ନାମ</th><th>Status</th><th>Sequence</th><th>Remarks</th></tr></thead><tbody id="rows"><tr><td colspan="5">Loading data…</td></tr></tbody></table></div><p id="total"></p></section></main><footer>ଗୁଜବରେ ବିଶ୍ୱାସ ନ କରି, ପ୍ରମାଣ ମାଗନ୍ତୁ।<small>Website Designed &amp; Developed by Rabi</small></footer><script>
const API='https://script.google.com/macros/s/AKfycbxJHFvJ7uQCo1tmON660ITNqkR8b7drviS2Is7I7IyhxKvO_n9JfnivO_UtT33lGtnv/exec';let list=[];function pick(o,keys){for(let k of keys)if(o&&o[k]!=null&&o[k]!== '')return o[k];return ''}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(data){let arr=data.kirtanLive||data.kirtan||data.kirtanList||data.mandalis||[];if(!Array.isArray(arr))arr=[];return arr.map((x,i)=>({serial:pick(x,['serial','srl','no','number'])||i+1,name:pick(x,['mandaliName','name','kirtanMandali','mandali']),status:pick(x,['status','state']),sequence:pick(x,['sequence','order','seq']),remarks:pick(x,['remarks','remark','notes'])})).filter(x=>x.name||x.status)}function render(){let q=document.getElementById('search').value.toLowerCase().trim(),f=document.getElementById('filter').value;let rows=list.filter(x=>(!q||[x.name,x.status,x.sequence,x.remarks].some(v=>String(v).toLowerCase().includes(q)))&&(f==='all'||(f==='active'&&/active|ଚାଲୁ|ବର୍ତ୍ତମାନ/i.test(String(x.status)))||(f==='inactive'&&!/active|ଚାଲୁ|ବର୍ତ୍ତମାନ/i.test(String(x.status)))));document.getElementById('rows').innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.serial)}</td><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td>${esc(x.sequence)}</td><td>${esc(x.remarks)}</td></tr>`).join(''):'<tr><td colspan="5">କୌଣସି data ମିଳିଲା ନାହିଁ</td></tr>';document.getElementById('total').textContent='ମୋଟ ମଣ୍ଡଳୀ: '+rows.length}function loadData(){document.getElementById('state').textContent='Loading…';let cb='cb_kirtan_'+Date.now();window[cb]=data=>{list=norm(data);document.getElementById('state').textContent='Live';render();delete window[cb]};let s=document.createElement('script');s.src=API+'?action=data&callback='+cb;s.onerror=()=>{document.getElementById('state').textContent='Error';document.getElementById('rows').innerHTML='<tr><td colspan="5">API data load ହୋଇପାରିଲା ନାହିଁ।</td></tr>'};document.body.appendChild(s)}document.getElementById('search').addEventListener('input',render);document.getElementById('filter').addEventListener('change',render);loadData();</script></body></html>
